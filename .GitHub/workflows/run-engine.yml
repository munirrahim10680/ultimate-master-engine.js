name: Century-Proof Engine Auto-Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      - name: Run Master Engine
        env:
          TARGET_URL: "https://www.facebook.com/share/v/1G3GPxmLEP/"
          TOTAL_VIEWS: "8500"
          CONCURRENCY: "8"
        run: |
          node ultimate-master-engine.js
