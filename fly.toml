app = 'ultimate-master-engine-js'
primary_region = 'ams'

[build]

[env]
  PORT = "8080"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048

[[restart]]
  policy = 'on-failure'
  processes = ['app']
